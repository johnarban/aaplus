<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AA+ WASM Function Explorer</title>
  <style>
    body {
      margin: 12px;
      font-family: sans-serif;
      font-size: 12px;
    }
    header {
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 12px;
    }
    .sidebar, .content {
      border: 1px solid #ccc;
      padding: 8px;
    }
    .card {
      border: 1px solid #ddd;
      padding: 8px;
      margin-bottom: 8px;
    }
    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      font-size: 12px;
      padding: 4px 6px;
    }
    textarea { min-height: 90px; font-family: monospace; }
    .list { margin: 6px 0 0 0; padding: 0; list-style: none; }
    .list li { padding: 4px 6px; cursor: pointer; }
    .list li.active { background: #eee; }
    pre { white-space: pre-wrap; font-family: monospace; font-size: 11px; }
    .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  </style>
</head>
<body>
  <header>
    <h1>AA+ WASM Function Explorer</h1>
    <p>Browse and execute every exposed function with JSON arguments.</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="card">
        <label for="search">Search</label>
        <input id="search" placeholder="Filter classes or functions" />
      </div>
      <div class="card">
        <strong>Classes</strong>
        <ul id="classList" class="list"></ul>
      </div>
    </aside>

    <main class="content">
      <div class="card">
        <div class="grid">
          <div>
            <label for="functionList">Functions</label>
            <select id="functionList"></select>
          </div>
          <div>
            <label for="globals">Globals</label>
            <select id="globals"></select>
          </div>
        </div>
      </div>

      <div class="card">
        <label for="args">Arguments (JSON array)</label>
        <textarea id="args">[]</textarea>
        <button id="run">Run</button>
      </div>

      <div class="card">
        <strong>Output</strong>
        <pre id="output">Loading WASM...</pre>
      </div>

      <div class="card">
        <strong>Examples</strong>
        <pre id="examples"></pre>
      </div>
    </main>
  </div>

  <script type="module">
    // Generated by Copilot
    import createAAPlusModule from "../dist/aaplus.js";

    const classList = document.getElementById("classList");
    const functionList = document.getElementById("functionList");
    const globalsSelect = document.getElementById("globals");
    const argsInput = document.getElementById("args");
    const output = document.getElementById("output");
    const searchInput = document.getElementById("search");
    const examples = document.getElementById("examples");

    let signatures = {};

    let Module;
    let classNames = [];
    let functionsByClass = new Map();

    const GLOBALS = ["version", "versionNumber", "dateToJD"];

    const EXAMPLE_ARGS = {
      "CAASun.geometricEclipticLongitude": "[2460700.5, true]",
      "CAASun.apparentEclipticLongitude": "[2460700.5, true]",
      "CAAMoon.eclipticLongitude": "[2460700.5]",
      "CAADynamicalTime.deltaT": "[2460700.5]",
      "dateToJD": "[2026, 2, 3, 12, 0, 0, true]"
    };

    const GLOBAL_SIGNATURES = {
      "version": [],
      "versionNumber": [],
      "dateToJD": [
        { type: "long", name: "year" },
        { type: "long", name: "month" },
        { type: "long", name: "day" },
        { type: "long", name: "hour" },
        { type: "long", name: "minute" },
        { type: "double", name: "second" },
        { type: "bool", name: "gregorian" }
      ]
    };

    function setOutput(value) {
      output.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    function setExamples(key) {
      examples.textContent = EXAMPLE_ARGS[key] || "[]";
    }

    function renderSignature(classFn) {
      if (!classFn) return;
      const [className, fn] = classFn.split(".");
      let params = signatures?.[className]?.[fn];
      if (!params) {
        const pascalFn = fn ? fn.charAt(0).toUpperCase() + fn.slice(1) : fn;
        params = signatures?.[className]?.[pascalFn];
      }
      if (!params) params = [];

      const renderedParams = params.map((p) => {
        const name = p.name ? ` ${p.name}` : "";
        return `${p.type}${name}`;
      });
      const signature = `${className}.${fn}(${renderedParams.join(", ")})`;
      const example = EXAMPLE_ARGS[classFn] || "[]";
      examples.textContent = `${signature}\n\nArgs (JSON array):\n${example}`;
    }

    function renderGlobalSignature(fn) {
      const params = GLOBAL_SIGNATURES[fn] || [];
      const renderedParams = params.map((p) => {
        const name = p.name ? ` ${p.name}` : "";
        return `${p.type}${name}`;
      });
      const signature = `${fn}(${renderedParams.join(", ")})`;
      const example = EXAMPLE_ARGS[fn] || "[]";
      examples.textContent = `${signature}\n\nArgs (JSON array):\n${example}`;
    }

    function buildFunctionMap() {
      classNames = Object.keys(Module)
        .filter((name) => name.startsWith("CAA") && typeof Module[name] === "function" || typeof Module[name] === "object")
        .sort();

      functionsByClass = new Map();

      classNames.forEach((className) => {
        const cls = Module[className];
        const funcs = Object.keys(cls || {})
          .filter((key) => typeof cls[key] === "function")
          .sort();
        functionsByClass.set(className, funcs);
      });
    }

    function renderClasses(filter = "") {
      classList.innerHTML = "";
      const filtered = classNames.filter((name) => name.toLowerCase().includes(filter));
      filtered.forEach((name, idx) => {
        const li = document.createElement("li");
        li.textContent = name;
        li.dataset.className = name;
        if (idx === 0) li.classList.add("active");
        li.addEventListener("click", () => selectClass(name));
        classList.appendChild(li);
      });
      if (filtered.length > 0) selectClass(filtered[0]);
    }

    function selectClass(name) {
      [...classList.children].forEach((li) => {
        li.classList.toggle("active", li.dataset.className === name);
      });
      const funcs = functionsByClass.get(name) || [];
      functionList.innerHTML = "";
      funcs.forEach((fn) => {
        const opt = document.createElement("option");
        opt.value = `${name}.${fn}`;
        opt.textContent = fn;
        functionList.appendChild(opt);
      });
      if (funcs.length > 0) {
        functionList.value = `${name}.${funcs[0]}`;
        renderSignature(`${name}.${funcs[0]}`);
      }
    }

    function renderGlobals() {
      globalsSelect.innerHTML = "";
      GLOBALS.forEach((fn) => {
        const opt = document.createElement("option");
        opt.value = fn;
        opt.textContent = fn;
        globalsSelect.appendChild(opt);
      });
    }

    function runSelected() {
      try {
        const args = JSON.parse(argsInput.value || "[]");
        if (!Array.isArray(args)) {
          setOutput("Arguments must be a JSON array.");
          return;
        }

        const classFn = functionList.value;
        if (classFn) {
          const [className, fn] = classFn.split(".");
          const result = Module[className][fn](...args);
          setOutput(result);
          return;
        }

        const globalFn = globalsSelect.value;
        if (globalFn) {
          const result = Module[globalFn](...args);
          setOutput(result);
        }
      } catch (err) {
        setOutput(String(err));
      }
    }

    function onSearch() {
      const filter = searchInput.value.trim().toLowerCase();
      renderClasses(filter);
    }

    function syncExample() {
      const classFn = functionList.value;
      if (classFn) renderSignature(classFn);
    }

    (async () => {
      try {
        Module = await createAAPlusModule();
        console.log("AA+ WASM module loaded.", Module);
        try {
          const res = await fetch("../function_signatures.json");
          signatures = await res.json();
        } catch (e) {
          signatures = {};
        }
        renderGlobals();
        buildFunctionMap();
        renderClasses();
        setOutput("WASM loaded. Select a function and provide JSON arguments.");
        argsInput.value = "[]";
      } catch (err) {
        setOutput("Failed to load WASM: " + err);
      }
    })();

    document.getElementById("run").addEventListener("click", runSelected);
    functionList.addEventListener("change", syncExample);
    searchInput.addEventListener("input", onSearch);
    globalsSelect.addEventListener("change", () => renderGlobalSignature(globalsSelect.value));
  </script>
</body>
</html>
