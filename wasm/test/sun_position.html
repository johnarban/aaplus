<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AA+ WASM Sun Position</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 24px;
      line-height: 1.5;
    }
    .row {
      margin: 8px 0;
    }
    label {
      display: inline-block;
      width: 160px;
      font-weight: 600;
    }
    input, select, button {
      padding: 6px 8px;
      font-size: 14px;
    }
    pre {
      background: #f6f8fa;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>AA+ WASM Sun Position</h1>

  <div class="row">
    <label for="date">Date (UTC)</label>
    <input type="datetime-local" id="date" />
  </div>

  <div class="row">
    <label for="precision">High precision</label>
    <select id="precision">
      <option value="true" selected>true</option>
      <option value="false">false</option>
    </select>
  </div>

  <div class="row">
    <button id="compute">Compute Sun Position</button>
  </div>

  <pre id="output">Loading WASM...</pre>

  <script type="module">
    // Generated by Copilot
    import createAAPlusModule from "../dist/aaplus.js";
    
    const output = document.getElementById("output");
    const dateInput = document.getElementById("date");
    const precisionSelect = document.getElementById("precision");
    const computeButton = document.getElementById("compute");

    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    dateInput.value = now.toISOString().slice(0, 16);

    let Module;
    console.log("Starting to load AA+ WASM module...");
    function toJulianDay(date) {
      const year = date.getUTCFullYear();
      const month = date.getUTCMonth() + 1;
      const day = date.getUTCDate();
      const hour = date.getUTCHours();
      const minute = date.getUTCMinutes();
      const second = date.getUTCSeconds() + date.getUTCMilliseconds() / 1000;
      return Module.dateToJD(year, month, day, hour, minute, second, true);
    }

    function formatNumber(value) {
      return Number.isFinite(value) ? value.toFixed(8) : "NaN";
    }

    function renderResult(result) {
      output.textContent = JSON.stringify(result, null, 2);
    }

    function computeSunPosition() {
      const dt = new Date(dateInput.value);
      if (Number.isNaN(dt.getTime())) {
        output.textContent = "Invalid date";
        return;
      }

      const jd = toJulianDay(dt);
      const highPrecision = precisionSelect.value === "true";

      const lon = Module.CAASun.geometricEclipticLongitude(jd, highPrecision);
      const lat = Module.CAASun.geometricEclipticLatitude(jd, highPrecision);
      const lonApp = Module.CAASun.apparentEclipticLongitude(jd, highPrecision);
      const latApp = Module.CAASun.apparentEclipticLatitude(jd, highPrecision);

      renderResult({
        dateUtc: dt.toISOString(),
        julianDay: jd,
        geometricEclipticLongitude: formatNumber(lon),
        geometricEclipticLatitude: formatNumber(lat),
        apparentEclipticLongitude: formatNumber(lonApp),
        apparentEclipticLatitude: formatNumber(latApp)
      });
    }

    (async () => {
      try {
        Module = await createAAPlusModule();
        console.log("AA+ WASM module loaded.", Module);
        output.textContent = "WASM loaded. Ready.";
        computeButton.disabled = false;
        computeButton.addEventListener("click", computeSunPosition);
      } catch (err) {
        output.textContent = "Failed to load WASM: " + err;
      }
    })();
  </script>
</body>
</html>
